[package]
name = "chibimadness-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Native WebView desktop client for ChibiMadness."
build = "build.rs"

[[bin]]
name = "chibimadness-desktop"
path = "src/launcher.rs"

[[bin]]
name = "chibimadness-game"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2.32"
bytemuck = { version = "1.24.0", features = ["derive"] }
image = { version = "0.25.9", default-features = false, features = ["png"] }
lyon_path = "1.0.16"
lyon_tessellation = "1.0.16"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
ureq = "2.12.1"
url = "2.5.8"
# Yuyib's WebView host uses Wry, but its default dependency set intentionally
# omits this opt-in feature. Without it WebView2 ignores `with_transparent`
# and paints an opaque white controller over the owned WGPU game window.
wry = { version = "0.55.1", default-features = false, features = ["transparent"] }
yuyib = { git = "https://github.com/Anerson-Auf/yuyib.git", rev = "5b347c8ca07a234fb43fc80be051ed1eae145558", default-features = false, features = ["webview"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
