[package]
name = "chibimadness-server"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Bounded WebSocket presence and chat server for ChibiMadness."

[dependencies]
futures-util = "0.3.33"
getrandom = "0.4.3"
serde_json = "1.0.149"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.30.0"
